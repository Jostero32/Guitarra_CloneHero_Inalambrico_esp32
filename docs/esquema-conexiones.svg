<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Guitarra Clone Hero: esquema de conexiones</title>
  <style>
    .card { fill: #ffffff; stroke: #e5e7eb; }
    .t { fill: #111827; }
    .muted { fill: #6b7280; }
    .pinlbl { fill: #e5e7eb; font-size: 12px; font-family: Consolas, Menlo, monospace; }
    .pinused { fill: #facc15; font-weight: 700; }
    .pinwarn { fill: #fb923c; font-weight: 700; }
    .sig { stroke: #2563eb; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #374151; stroke-width: 2.5; fill: none; }
    .comp { stroke: #111827; stroke-width: 2; fill: none; }
    .lbl { font-size: 13px; fill: #111827; font-weight: 700; }
    .sub { font-size: 12px; fill: #6b7280; }
  </style>

  <rect class="card" x="1" y="1" width="998" height="658" rx="14"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700">Guitarra Clone Hero · esquema de conexiones</text>
  <text class="muted" x="40" y="62" font-size="13">ESP32 DevKit V1 como gamepad Bluetooth LE · 10 pulsadores entre GPIO y GND</text>

  <!-- ESP32 (header izquierdo) -->
  <rect x="700" y="90" width="230" height="480" rx="10" fill="#1b2533"/>
  <rect x="768" y="106" width="140" height="150" rx="4" fill="#9ca3af"/>
  <rect x="778" y="116" width="120" height="96" rx="2" fill="#6b7280"/>
  <text x="838" y="170" text-anchor="middle" font-size="12" fill="#f9fafb" font-weight="700">ESP32-WROOM-32</text>
  <path d="M780 224 h20 v-8 h12 v8 h12 v-8 h12 v8 h12 v-8 h12 v8 h20" stroke="#374151" stroke-width="2" fill="none"/>
  <rect x="785" y="558" width="60" height="26" rx="4" fill="#9ca3af"/>
  <text x="815" y="602" text-anchor="middle" class="sub">USB</text>
  <text x="838" y="330" text-anchor="middle" font-size="11" fill="#9ca3af">BLE: «Guitarra Azul»</text>
  <g>
    <circle cx="712" cy="130" r="5" fill="#6b7280"/><text class="pinlbl" x="724" y="134">EN</text>
    <circle cx="712" cy="158" r="5" fill="#6b7280"/><text class="pinlbl" x="724" y="162">VP</text>
    <circle cx="712" cy="186" r="5" fill="#6b7280"/><text class="pinlbl" x="724" y="190">VN</text>
    <circle cx="712" cy="214" r="5" fill="#fb923c"/><text class="pinlbl pinwarn" x="724" y="218">D34 *</text>
    <circle cx="712" cy="242" r="5" fill="#fb923c"/><text class="pinlbl pinwarn" x="724" y="246">D35 *</text>
    <circle cx="712" cy="270" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="274">D32</text>
    <circle cx="712" cy="298" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="302">D33</text>
    <circle cx="712" cy="326" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="330">D25</text>
    <circle cx="712" cy="354" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="358">D26</text>
    <circle cx="712" cy="382" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="386">D27</text>
    <circle cx="712" cy="410" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="414">D14</text>
    <circle cx="712" cy="438" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="442">D12</text>
    <circle cx="712" cy="466" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="470">D13</text>
    <circle cx="712" cy="494" r="5" fill="#facc15"/><text class="pinlbl pinused" x="724" y="498">GND</text>
    <circle cx="712" cy="522" r="5" fill="#6b7280"/><text class="pinlbl" x="724" y="526">VIN</text>
  </g>

  <!-- Pulsadores: pin → pulsador (contactos en 452 y 500) → bus GND en x=360 -->
  <g id="botones">
    <path class="sig" d="M707 214 H504 M707 242 H504 M707 270 H504 M707 298 H504 M707 326 H504 M707 354 H504 M707 382 H504 M707 410 H504 M707 438 H504 M707 466 H504"/>
    <g class="comp">
      <circle cx="500" cy="214" r="3.5"/><circle cx="452" cy="214" r="3.5"/><path d="M444 204 H508 M476 204 V197 M468 197 H484"/>
      <circle cx="500" cy="242" r="3.5"/><circle cx="452" cy="242" r="3.5"/><path d="M444 232 H508 M476 232 V225 M468 225 H484"/>
      <circle cx="500" cy="270" r="3.5"/><circle cx="452" cy="270" r="3.5"/><path d="M444 260 H508 M476 260 V253 M468 253 H484"/>
      <circle cx="500" cy="298" r="3.5"/><circle cx="452" cy="298" r="3.5"/><path d="M444 288 H508 M476 288 V281 M468 281 H484"/>
      <circle cx="500" cy="326" r="3.5"/><circle cx="452" cy="326" r="3.5"/><path d="M444 316 H508 M476 316 V309 M468 309 H484"/>
      <circle cx="500" cy="354" r="3.5"/><circle cx="452" cy="354" r="3.5"/><path d="M444 344 H508 M476 344 V337 M468 337 H484"/>
      <circle cx="500" cy="382" r="3.5"/><circle cx="452" cy="382" r="3.5"/><path d="M444 372 H508 M476 372 V365 M468 365 H484"/>
      <circle cx="500" cy="410" r="3.5"/><circle cx="452" cy="410" r="3.5"/><path d="M444 400 H508 M476 400 V393 M468 393 H484"/>
      <circle cx="500" cy="438" r="3.5"/><circle cx="452" cy="438" r="3.5"/><path d="M444 428 H508 M476 428 V421 M468 421 H484"/>
      <circle cx="500" cy="466" r="3.5"/><circle cx="452" cy="466" r="3.5"/><path d="M444 456 H508 M476 456 V449 M468 449 H484"/>
    </g>
    <path class="gnd" d="M448 214 H360 M448 242 H360 M448 270 H360 M448 298 H360 M448 326 H360 M448 354 H360 M448 382 H360 M448 410 H360 M448 438 H360 M448 466 H360"/>
    <path class="gnd" d="M360 214 V494 H707"/>
    <g fill="#374151">
      <circle cx="360" cy="242" r="3.5"/><circle cx="360" cy="270" r="3.5"/><circle cx="360" cy="298" r="3.5"/>
      <circle cx="360" cy="326" r="3.5"/><circle cx="360" cy="354" r="3.5"/><circle cx="360" cy="382" r="3.5"/>
      <circle cx="360" cy="410" r="3.5"/><circle cx="360" cy="438" r="3.5"/><circle cx="360" cy="466" r="3.5"/>
    </g>
  </g>

  <!-- Etiquetas de botón (número del gamepad) -->
  <g text-anchor="end">
    <text class="lbl" x="345" y="218">Botón 9</text>
    <text class="lbl" x="345" y="246">Botón 8</text>
    <text class="lbl" x="345" y="274">Botón 7</text>
    <text class="lbl" x="345" y="302">Botón 6</text>
    <text class="lbl" x="345" y="330">Botón 5</text>
    <text class="lbl" x="345" y="358">Botón 4</text>
    <text class="lbl" x="345" y="386">Botón 3</text>
    <text class="lbl" x="345" y="414">Botón 2</text>
    <text class="lbl" x="345" y="442">Botón 10</text>
    <text class="lbl" x="345" y="470">Botón 1</text>
  </g>
  <text class="sub" x="300" y="512">GND común</text>

  <!-- Pull-up externa para GPIO34/35 -->
  <rect x="520" y="120" width="160" height="56" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="600" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">* GPIO34 y GPIO35</text>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#9a3412">10 kΩ de cada pin a 3V3</text>
  <path d="M600 176 V196" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Notas -->
  <text class="sub" x="40" y="560">• Los botones se leen con INPUT_PULLUP: en reposo valen 1 y al presionar 0.</text>
  <text class="sub" x="40" y="580">• GPIO34 y 35 son solo de entrada y no tienen pull-up interna: sin la resistencia externa quedan flotando.</text>
  <text class="sub" x="40" y="620">• GPIO12 es pin de arranque: solo pulsador a GND, sin resistencia a 3V3, o el ESP32 no arranca.</text>
  <text class="sub" x="40" y="600">• En Clone Hero los botones 1 a 10 se asignan a trastes, rasgueo y menú desde la configuración del control.</text>
</svg>
